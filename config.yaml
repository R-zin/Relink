# Global configuration -- landslide susceptibility & risk mapping engine.
# Region-specific settings live in config/regions/<region>.yaml (see plan.md 1A).

random_seed: 42

features:
  continuous:
    - elev
    - slope
    - aspect_sin
    - aspect_cos
    - curvature
    - ndvi
    - rain_1d
    - rain_3d
    - rain_7d
  categorical:
    - lulc
    # geology: only if the acquisition fallback chain succeeded (plan.md 1A.4)
    # - geology

risk_thresholds:            # upper bounds of each class on P(landslide|features)
  - { class: 1, name: "Very Low",  max: 0.20, color: "#2ca02c" }
  - { class: 2, name: "Low",       max: 0.40, color: "#ffff00" }
  - { class: 3, name: "Moderate",  max: 0.60, color: "#ff7f0e" }
  - { class: 4, name: "High",      max: 0.80, color: "#d62728" }
  - { class: 5, name: "Very High", max: 1.01, color: "#7b0177" }

polygonize:
  min_area_km2: 0.05        # drop connected components smaller than this
  high_risk_classes: [4, 5] # classes included in risk_regions.geojson
  simplify_tolerance_m: 30  # polygon simplification (map units)

dataset:
  neg_pos_ratio: 3          # target negatives per positive (1:3)
  pos_buffer_px: 1          # buffer landslide points to at least 1 pixel
  neg_buffer_m: 250         # negatives kept this far away from positives
  split_fractions: { train: 0.6, val: 0.2, test: 0.2 }

models:
  logistic_regression:
    max_iter: 500
  random_forest:
    n_estimators: 200
    max_depth: 16
    n_jobs: -1
  xgboost:
    n_estimators: 300
    max_depth: 8
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    tree_method: hist

prediction:
  block_rows: 256           # rows per prediction chunk (chunked raster write)

disclaimer: >-
  Susceptibility indicates where landslides are more likely; it is not a
  detection of an active event. Output means "potential landslide-prone
  region", never confirmed active landslide detection.
