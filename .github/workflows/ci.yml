name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. Backend: FastAPI + PostgreSQL Service Container
  # ---------------------------------------------------------------------------
  backend-ci:
    name: Backend (FastAPI + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt cryptography

      - name: Verify Python compilation
        run: |
          python -m compileall backend/app/

      - name: Run Alembic migrations against PostgreSQL
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/postgres
        run: |
          python -m alembic upgrade head

      - name: Run Backend Pytest Suite
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/postgres
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgrespassword@localhost:5432/relink_test
        run: |
          pytest -v --durations=10

  # ---------------------------------------------------------------------------
  # 2. Dashboard: React 19 + Vite + Tailwind CSS v4
  # ---------------------------------------------------------------------------
  dashboard-ci:
    name: Dashboard (React + Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        working-directory: dashboard
        run: npm ci

      - name: Lint with Oxlint
        working-directory: dashboard
        run: npm run lint

      - name: Build production bundle
        working-directory: dashboard
        run: npm run build

      - name: Security audit
        working-directory: dashboard
        run: npm audit --audit-level=high

  # ---------------------------------------------------------------------------
  # 3. Mobile: Flutter / Dart Suite
  # ---------------------------------------------------------------------------
  mobile-ci:
    name: Mobile App (Flutter)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze code
        working-directory: mobile
        run: flutter analyze --no-fatal-infos

      - name: Run unit & widget tests
        working-directory: mobile
        run: flutter test

  # ---------------------------------------------------------------------------
  # 4. ML Module: Configuration & Code Validation
  # ---------------------------------------------------------------------------
  ml-validation:
    name: ML Module Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Verify ML configurations syntax
        run: |
          python -c "
          import glob, yaml
          with open('ML/config.yaml') as f:
              cfg = yaml.safe_load(f)
              assert 'features' in cfg
              assert 'risk_thresholds' in cfg
          print('ML global config syntax valid.')
          for path in glob.glob('ML/config/regions/*.yaml'):
              with open(path) as f:
                  r = yaml.safe_load(f)['region']
                  assert 'name' in r
                  assert 'boundary_path' in r
                  print(f'Region config valid: {r[\"name\"]}')
          "

      - name: Verify Python compilation on ML scripts
        run: |
          python -m py_compile ML/main.py ML/region.py ML/make_boundary.py

  # ---------------------------------------------------------------------------
  # 5. Security & Secret Hygiene Gate
  # ---------------------------------------------------------------------------
  security-and-hygiene:
    name: Security & Secret Hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Ensure no sensitive files or private keys are committed
        run: |
          echo "Scanning tracked repository files for private keys and environment secrets..."
          SUSPICIOUS=$(git ls-files | grep -iE '(\.env$|\.env\.local|\.key$|\.pem$|\.p12$|\.keystore$|id_rsa)' || true)
          if [ -n "$SUSPICIOUS" ]; then
            echo "ERROR: Suspicious secret files tracked in git:"
            echo "$SUSPICIOUS"
            exit 1
          fi
          echo "Clean: No tracked secret files found in repository."

      - name: Verify .gitignore contains essential security exclusions
        run: |
          grep -E '^\.env' .gitignore
          grep -E '^\*\.key' .gitignore
          grep -E '^\*\.pem' .gitignore
          echo "Clean: Required security exclusion patterns present in .gitignore."
