name: relink_mobile
description: "RELINK — disaster resilience app (offline-first SOS, mesh relay, live map)."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  path: ^1.8.0
  uuid: ^4.3.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  http: ^1.2.2
  connectivity_plus: ^6.0.5
  provider: ^6.1.2
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  nearby_connections: ^4.0.0
  permission_handler: ^11.3.0
  cryptography: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.0

flutter:
  uses-material-design: true
