# Kerala master AOI (plan.md 1A.2 / Phase 0)
region:
  name: Kerala
  boundary_path: data/regions/kerala/boundary.geojson
  crs: EPSG:32643            # UTM zone 43N covers Kerala (state-scale prototype;
                             # single-zone distortion documented in README)
  target_resolution_m: 30
  block_size_km: 5           # spatial split block size
grid:
  snap: align-to-boundary
  buffer_m: 500
outputs_dir: outputs/Kerala
